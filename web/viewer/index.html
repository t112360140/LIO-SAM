<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <title>LIO-SAM 3D Map Viewer</title>
    <!-- 引入 Three.js -->
    <script src="./js/three.min.js"></script>
    <script src="./js/OrbitControls.js"></script>
    <link href="./css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Three.js 渲染區 -->
    <div id="canvas-container"></div>
    
    <!-- 讀取遮罩 -->
    <div id="loading" class="loading-toast">連線至地圖伺服器...</div>

    <!-- 右側控制面板 -->
    <div class="control-panel">
        <h2>📍 3D Map Viewer</h2>
        
        <div class="status-panel">
            <p><strong>地圖模式：</strong> <span id="map-mode" style="color: #4caf50;">Loading...</span></p>
            <p><strong>載入區塊數：</strong> <span id="chunk-count" style="color: #ffeb3b;">0</span></p>
            <p><strong>當前相機座標：</strong></p>
            <p id="camera-pos" style="font-family: monospace; color: #00bfff; font-size: 14px;">X: 0.0, Y: 0.0, Z: 0.0</p>
        </div>

        <div class="btn-group">
            <div style="margin-bottom: 10px; margin-top: 5px;">
                <label style="cursor: pointer; display: flex; align-items: center; gap: 8px;">
                    <input type="checkbox" id="color-checkbox" checked style="width: 16px; height: 16px; cursor: pointer;">
                    🌈 顯示彩色點雲
                </label>
            </div>
            
            <div style="margin-bottom: 10px;">
                <label style="cursor: pointer; display: flex; align-items: center; gap: 8px;">
                    <input type="checkbox" id="grid-checkbox" checked style="width: 16px; height: 16px; cursor: pointer;">
                    📏 顯示參考網格
                </label>
            </div>
            
            <button class="btn btn-warning" id="btn-refresh">🔄 重新整理視野</button>
        </div>
    </div>

    <script src="./js/main.js"></script>
</body>
</html>
